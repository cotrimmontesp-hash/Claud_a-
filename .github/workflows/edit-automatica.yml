name: Edit automática

on:
  workflow_dispatch:
    inputs:
      jogador:
        description: Nome do jogador
        required: true
        default: Neymar
        type: string
      duracao:
        description: Duração aproximada em segundos
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar ffmpeg, fonte e yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+x /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Montar o edit
        env:
          JOGADOR: ${{ inputs.jogador }}
          DURACAO: ${{ inputs.duracao }}
          EDIT_OUT: ${{ github.workspace }}/out
        run: node scripts/edit-automatica.js

      - name: Publicar o vídeo
        uses: actions/upload-artifact@v4
        with:
          name: edit-${{ inputs.jogador }}
          path: out/edit.mp4
          if-no-files-found: error
